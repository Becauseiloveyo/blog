name: Temporary nginx route shape inspection
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-preflight.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect CF server block shape without paths or keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 130s
          script_stop: false
          script: |
            set +e
            echo '=== NGINX FILES CONTAINING CF HOST ==='
            python3 - <<'PY'
            from pathlib import Path
            import re
            for p in Path('/etc/nginx').rglob('*'):
             if not p.is_file() or p.is_symlink(): continue
             try:s=p.read_text(errors='replace')
             except (OSError,UnicodeError):continue
             if 'cf.gooffu.tech' not in s: continue
             print('config_file='+str(p))
             for line in s.splitlines():
              l=line.strip()
              if re.search(r'^\s*(server|http|stream)\s*\{',l): print('  '+l)
              elif l.startswith('listen '): print('  '+l)
              elif l.startswith('server_name '): print('  '+l)
              elif l.startswith('location '):print('  location=<existing>')
              elif l.startswith('proxy_pass ') or l.startswith('grpc_pass '):
               print('  '+re.sub(r'(?:127\.0\.0\.1|localhost):\d+', '127.0.0.1:<port>',l))
              elif l.startswith('include '):print('  '+l)
            PY
            echo '=== STREAM CONNECTIONS AND CF SERVICES ==='
            for x in xray-racknerd-cf-ws nginx xray-racknerd-443; do echo "$x=$(systemctl is-active "$x" 2>/dev/null)"; done
            printf 'cf_xray_service_command='; systemctl show xray-racknerd-cf-ws -p ExecStart --value 2>/dev/null | sed -E 's/config[^ ]*\.json/config.json/g;s#/[a-zA-Z0-9._/-]+\.json#<json>#g' | cut -c 1-140
            echo
            echo '=== CERT DOMAIN SCOPE ==='
            for f in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do [ -f "$f" ] || continue; if grep -q 'cf.gooffu.tech' "$f"; then printf 'candidate=%s ' "$f"; wc -l < "$f"; fi; done
            echo '=== DONE ==='
