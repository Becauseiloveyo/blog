name: Temporary final post-XHTTP safety check
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-preflight.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify localhost-only XHTTP and old services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 130s
          script_stop: false
          script: |
            set +e
            echo '=== POST XHTTP READ ONLY CHECK ==='
            printf 'memory='; free -m | awk '/^Mem:/ {printf "total=%s used=%s available=%s\n",$2,$3,$7}'
            printf 'disk='; df -h / | awk 'NR==2{printf "used=%s free=%s pct=%s\n",$3,$4,$5}'
            printf 'xhttp_bind_loopback='; ss -H -lnt | awk '{print $4}' | grep -Eq '^127\.0\.0\.1:18081$' && echo PASS || echo FAIL
            printf 'xray_xhttp_config='; /usr/local/bin/xray run -test -config /etc/myvps/xhttp/config.json >/dev/null 2>&1 && echo PASS || echo FAIL
            printf 'nginx_syntax='; nginx -t >/dev/null 2>&1 && echo PASS || echo FAIL
            printf 'backup_watch_timer='; systemctl is-enabled myvps-backup-watch.timer
            printf 'backup_watch_active='; systemctl is-active myvps-backup-watch.timer
            for host in cf.gooffu.tech blog.gooffu.tech; do
             out=$(curl --noproxy '*' --connect-timeout 6 --max-time 10 --resolve "$host:443:127.0.0.1" -ksS -o /dev/null -w '%{http_code}' "https://$host/" 2>/dev/null)
             echo "local_https_$host=$out"
            done
            for s in nginx xray-racknerd-443 xray-racknerd-cf-ws myvps-xhttp fail2ban; do echo "service_$s=$(systemctl is-active "$s")"; done
            echo '=== CHECK COMPLETE ==='
