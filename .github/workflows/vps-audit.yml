name: Temporary VPS connectivity check
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/vps-audit.yml
permissions:
  contents: read
jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check configured host TCP ports without printing host
        env:
          TARGET_HOST: ${{ secrets.SERVER_HOST }}
          TARGET_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          python3 - <<'PY'
          import os, socket, errno
          host=os.environ.get('TARGET_HOST','').strip()
          if not host:
              print('SERVER_HOST: MISSING'); raise SystemExit(1)
          try:
              ssh_port=int(os.environ.get('TARGET_PORT','22'))
          except ValueError:
              print('SERVER_PORT: INVALID'); raise SystemExit(1)
          for label, port in [('configured SSH',ssh_port),('HTTPS',443),('HTTP',80)]:
              try:
                  socket.create_connection((host,port),timeout=5).close()
                  print(f'{label} port {port}: TCP CONNECTED')
              except socket.timeout:
                  print(f'{label} port {port}: TCP TIMEOUT')
              except ConnectionRefusedError:
                  print(f'{label} port {port}: TCP REFUSED')
              except OSError as exc:
                  print(f'{label} port {port}: NETWORK ERROR {type(exc).__name__}')
          PY
