name: Temporary VPS read-only check
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/vps-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test configured VPS TCP endpoints
        id: reach
        env:
          TARGET_HOST: ${{ secrets.SERVER_HOST }}
          TARGET_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          python3 - <<'PY'
          import os, socket
          host = os.environ.get('TARGET_HOST','').strip()
          if not host:
              print('SERVER_HOST is empty or unavailable'); raise SystemExit(1)
          try: ssh_port = int(os.environ.get('TARGET_PORT','22'))
          except ValueError: print('SERVER_PORT invalid'); raise SystemExit(1)
          connected = False
          for label,port in [('SSH',ssh_port),('HTTPS',443),('HTTP',80)]:
              try:
                  socket.create_connection((host,port),timeout=6).close()
                  print(f'{label} port {port}: CONNECTED')
                  if label=='SSH': connected=True
              except socket.timeout: print(f'{label} port {port}: TIMEOUT')
              except ConnectionRefusedError: print(f'{label} port {port}: REFUSED')
              except OSError as exc: print(f'{label} port {port}: {type(exc).__name__}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as fp: fp.write(f'ssh_open={str(connected).lower()}\n')
          PY
      - name: Read-only VPS internal audit via SSH
        if: steps.reach.outputs.ssh_open == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 100s
          script_stop: true
          script: |
            set -u
            export LC_ALL=C
            echo '=== VPS read-only audit ==='
            printf 'UTC: '; date -u '+%Y-%m-%d %H:%M:%S'
            printf 'OS: '; ( . /etc/os-release && printf '%s\n' "$PRETTY_NAME" ) 2>/dev/null || echo unknown
            printf 'Kernel: '; uname -r
            printf 'Uptime: '; uptime -p 2>/dev/null || true
            printf 'CPU threads: '; nproc 2>/dev/null || true
            printf 'Memory: '; free -h | awk '/^Mem:/ {printf "total=%s used=%s available=%s\n", $2,$3,$7}'
            printf 'Root disk: '; df -h / | awk 'NR==2 {printf "size=%s used=%s available=%s usage=%s\n",$2,$3,$4,$5}'
            echo '--- Systemd service states ---'
            for svc in ssh nginx xray xray-racknerd-443 xray-racknerd-cf myvps-xray AdGuardHome adguardhome fail2ban; do
              if systemctl list-unit-files "$svc.service" --no-legend 2>/dev/null | grep -q .; then
                printf '%s: %s\n' "$svc" "$(systemctl is-active "$svc" 2>/dev/null || true)"
              else
                printf '%s: unit-not-found\n' "$svc"
              fi
            done
            echo '--- TCP port listening flags (no addresses) ---'
            if command -v ss >/dev/null 2>&1; then
              for port in 22 80 443 3000 8443 2053 15593 15594; do
                if ss -H -lnt | awk '{print $4}' | grep -Eq ":$port$"; then
                  printf 'tcp/%s: LISTEN\n' "$port"
                else
                  printf 'tcp/%s: NOT_LISTENING\n' "$port"
                fi
              done
            fi
            echo '--- Syntax checks / versions (no credential output) ---'
            if command -v nginx >/dev/null 2>&1; then
              if nginx -t >/dev/null 2>&1; then echo 'nginx: SYNTAX_PASS'; else echo 'nginx: NO_PERMISSION_OR_SYNTAX_FAIL'; fi
            fi
            for f in /usr/local/bin/xray /usr/bin/xray /opt/myvps/xray/xray; do
              if [ -x "$f" ]; then
                printf 'Xray version: '; "$f" version 2>/dev/null | head -n 1 || true
                break
              fi
            done
            xraybin=''
            for f in /usr/local/bin/xray /usr/bin/xray /opt/myvps/xray/xray; do
              if [ -x "$f" ]; then xraybin="$f"; break; fi
            done
            for f in /etc/xray-racknerd-443/config.json /usr/local/etc/xray/config.json /etc/myvps/xray/config.json; do
              if [ -f "$f" ]; then
                case "$f" in
                  /etc/xray-racknerd-443/*) label=real443 ;;
                  /usr/local/etc/xray/*) label=default_xray ;;
                  *) label=owned_xray ;;
                esac
                if [ -n "$xraybin" ]; then
                  if "$xraybin" run -test -config "$f" >/dev/null 2>&1; then
                    echo "$label: CONFIG_TEST_PASS"
                  else
                    echo "$label: CONFIG_TEST_FAILED_OR_NO_ACCESS"
                  fi
                fi
                if command -v jq >/dev/null 2>&1; then
                  jq -r --arg label "$label" '
                    "\($label) inbounds: " + ([.inbounds[]?.protocol] | sort | group_by(.) | map(.[0] + ":" + (length|tostring)) | join(", ")),
                    "\($label) transports: " + ([.inbounds[]?.streamSettings?.network // "default"] | sort | group_by(.) | map(.[0] + ":" + (length|tostring)) | join(", ")),
                    "\($label) security: " + ([.inbounds[]?.streamSettings?.security // "none"] | sort | group_by(.) | map(.[0] + ":" + (length|tostring)) | join(", ")),
                    "\($label) outbound protocols: " + ([.outbounds[]?.protocol] | sort | group_by(.) | map(.[0] + ":" + (length|tostring)) | join(", "))
                  ' "$f" 2>/dev/null || echo "$label: protocol summary unavailable"
                fi
              fi
            done
            echo '--- PM2 application status (no env vars) ---'
            if command -v pm2 >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
              pm2 jlist 2>/dev/null | jq -r '.[] | "PM2: " + (.name // "unnamed") + " " + (.pm2_env.status // "unknown")' 2>/dev/null || true
            fi
            echo '--- Backup utilities and timers ---'
            for bin in rclone gpg tar; do if command -v "$bin" >/dev/null 2>&1; then echo "$bin: installed"; else echo "$bin: unavailable"; fi; done
            for svc in myvps-backup-vps.timer myvps-backup-blog.timer; do
              printf '%s: %s\n' "$svc" "$(systemctl is-enabled "$svc" 2>/dev/null || echo not-enabled)"
            done
            echo '=== Audit complete; no configuration changes ==='
