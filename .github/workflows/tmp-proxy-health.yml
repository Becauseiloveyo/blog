name: Temporary SOCKS IPv4 health comparison
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/tmp-proxy-health.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare upstream IPv4 and IPv6 TCP with general VPS HTTPS egress
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 120s
          script_stop: false
          script: |
            set +e
            echo '=== RES SOCKS IPV4 AND GENERAL EGRESS COMPARISON ==='
            python3 - <<'PY'
            import socket,json,pathlib,time
            j=json.loads(pathlib.Path('/etc/xray-racknerd-443/config.json').read_text())
            servers=[s for o in j.get('outbounds',[]) if o.get('tag')=='res-socks' for s in o.get('settings',{}).get('servers',[])]
            if len(servers)!=1:print('server_config=UNEXPECTED');raise SystemExit(0)
            s=servers[0];host=s.get('address');port=int(s.get('port'))
            for fam,label in ((socket.AF_INET,'ipv4'),(socket.AF_INET6,'ipv6')):
             try:
              addrs=socket.getaddrinfo(host,port,fam,socket.SOCK_STREAM)
              print('proxy_'+label+'_record_count='+str(len(set(a[4][0] for a in addrs))))
              if not addrs:continue
              sk=None
              try:
               t=time.monotonic()
               sk=socket.socket(fam,socket.SOCK_STREAM);sk.settimeout(5);sk.connect(addrs[0][4])
               print('proxy_'+label+'_tcp=PASS elapsed_ms='+str(round((time.monotonic()-t)*1000)))
              except OSError as e:print('proxy_'+label+'_tcp=FAIL_'+type(e).__name__)
              finally:
               if sk:sk.close()
             except socket.gaierror:print('proxy_'+label+'_dns=UNAVAILABLE')
            except_marker='none'
            try:
             with socket.create_connection(('www.cloudflare.com',443),timeout=5) as sk:print('general_egress_tcp443=PASS')
            except OSError as e:print('general_egress_tcp443=FAIL_'+type(e).__name__)
            PY
            echo '=== Xray active ==='
            systemctl is-active xray-racknerd-443
