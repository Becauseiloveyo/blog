name: Temporary SOCKS transport stage check
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/tmp-proxy-health.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check upstream DNS TCP and SOCKS5 method without credentials
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 110s
          script_stop: false
          script: |
            set +e
            echo '=== SOCKS5 UPSTREAM TRANSPORT STAGES ==='
            python3 - <<'PY'
            import socket,json,pathlib,time
            cfg=json.loads(pathlib.Path('/etc/xray-racknerd-443/config.json').read_text())
            ss=[s for o in cfg.get('outbounds',[]) if o.get('tag')=='res-socks' and o.get('protocol')=='socks' for s in o.get('settings',{}).get('servers',[])]
            if len(ss)!=1: print('upstream_config=INVALID');raise SystemExit(0)
            x=ss[0]
            host=x.get('address');port=x.get('port')
            for attempt in [1,2]:
             sock=None
             try:
              a=socket.getaddrinfo(host,int(port),type=socket.SOCK_STREAM)
              print('attempt_'+str(attempt)+'_dns=PASS')
              t=time.monotonic()
              sock=socket.create_connection((host,int(port)),timeout=8)
              sock.settimeout(8)
              print('attempt_'+str(attempt)+'_tcp=PASS duration_ms='+str(round(1000*(time.monotonic()-t))))
              methods=bytes([0x05,0x02,0x00,0x02])
              sock.sendall(methods)
              response=sock.recv(2)
              print('attempt_'+str(attempt)+'_socks5_method='+({b'\x05\x02':'PASSWORD_AUTH_REQUIRED',b'\x05\x00':'NO_AUTH',b'\x05\xff':'NO_ACCEPTABLE_AUTH'}.get(response,'INVALID_OR_CLOSED')))
             except socket.gaierror: print('attempt_'+str(attempt)+'_dns=FAIL')
             except (ConnectionError,TimeoutError,OSError) as e: print('attempt_'+str(attempt)+'_transport_failure='+type(e).__name__)
             finally:
              if sock:sock.close()
            PY
            echo '=== SYSTEMD ==='
            systemctl is-active xray-racknerd-443
            echo '=== FINISHED ==='
