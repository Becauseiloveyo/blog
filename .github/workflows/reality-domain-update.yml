name: Temporary REALITY domain diagnostic update
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/reality-domain-update.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update parallel manager status and check REALITY domain
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 190s
          script_stop: false
          script: |
            set -Eeuo pipefail
            umask 077
            echo '=== READ-ONLY PRE-DEPLOY SERVICE CHECK ==='
            for s in nginx xray-racknerd-443 xray-racknerd-cf-ws myvps-xhttp; do systemctl is-active --quiet "$s" || exit 3; echo "$s=active"; done
            test "$(readlink -f /usr/local/bin/myvps)" = /root/my_vps_manager.sh
            test -f /opt/myvps/bin/my_vps_manager.sh
            test -f /opt/myvps/bin/myvps_runtime.py
            tmp=$(mktemp -d /var/tmp/myvps-reality-dns.XXXXXXXX)
            trap 'rm -rf -- "$tmp"' EXIT
            url="https://raw.githubusercontent.com/Becauseiloveyo/racknerd-v2ray-agent-manager/2b41c0ebd461c6b25b75b5fff2e7fd9e4dc58ae1"
            curl -fLsS --retry 2 --connect-timeout 10 --max-time 50 "$url/my_vps_manager.sh" -o "$tmp/my_vps_manager.sh"
            curl -fLsS --retry 2 --connect-timeout 10 --max-time 50 "$url/myvps_runtime.py" -o "$tmp/myvps_runtime.py"
            bash -n "$tmp/my_vps_manager.sh"
            PYTHONDONTWRITEBYTECODE=1 python3 -c 'import ast,sys;ast.parse(open(sys.argv[1]).read())' "$tmp/myvps_runtime.py"
            grep -Fq 'VERSION="2.3.1-rc3"' "$tmp/my_vps_manager.sh"
            grep -Fq 'reality-domain-status' "$tmp/my_vps_manager.sh"
            grep -Fq 'REALITY_CONNECT_HOST = "2b.gooffu.tech"' "$tmp/myvps_runtime.py"
            cp -a /opt/myvps/bin/my_vps_manager.sh /opt/myvps/bin/my_vps_manager.sh.previous
            cp -a /opt/myvps/bin/myvps_runtime.py /opt/myvps/bin/myvps_runtime.py.previous
            install -m 700 "$tmp/my_vps_manager.sh" /opt/myvps/bin/my_vps_manager.sh
            install -m 700 "$tmp/myvps_runtime.py" /opt/myvps/bin/myvps_runtime.py
            echo '=== REALITY DOMAIN CHECK (DNS/TCP ONLY) ==='
            /usr/local/bin/myvps-next reality-domain-status
            echo '=== REALITY AND BACKUP SERVICES UNCHANGED ==='
            for s in nginx xray-racknerd-443 xray-racknerd-cf-ws myvps-xhttp myvps-backup-config.timer myvps-backup-blog.timer myvps-backup-watch.timer; do systemctl is-active --quiet "$s"; echo "$s=active"; done
            echo '=== PRODUCTION MANAGER STILL PRESERVED ==='
            test "$(readlink -f /usr/local/bin/myvps)" = /root/my_vps_manager.sh
            echo 'legacy_myvps_alias=PRESERVED'
            echo '=== MYVPS REALITY DOMAIN LABEL DEPLOYED ==='
