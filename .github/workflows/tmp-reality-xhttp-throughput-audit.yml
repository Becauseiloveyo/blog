name: Temporary same-exit loopback REALITY speed comparison
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/tmp-reality-xhttp-throughput-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare RAW/Vision and XHTTP/REALITY over localhost and same VPS egress
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 240s
          script_stop: false
          script: |
            set +e
            umask 077
            echo '=== SERVER LOOPBACK RAW REALITY VS XHTTP REALITY COMPARISON ==='
            printf 'failed_systemd_units='; systemctl --failed --no-legend --plain | awk '{print $1}' | paste -sd ',' -
            tempdir=$(mktemp -d /var/tmp/myvps-perf-compare.XXXXXXXX)
            rawpid='';xpid=''
            cleanup() { if [ -n "$rawpid" ]; then kill "$rawpid" >/dev/null 2>&1; wait "$rawpid" >/dev/null 2>&1; fi; if [ -n "$xpid" ]; then kill "$xpid" >/dev/null 2>&1; wait "$xpid" >/dev/null 2>&1; fi; rm -rf "$tempdir"; }
            trap cleanup EXIT
            python3 - "$tempdir" <<'PY'
            import json,pathlib,subprocess,sys
            d=pathlib.Path(sys.argv[1]);s=json.loads(pathlib.Path('/etc/xray-racknerd-443/config.json').read_text())
            i=s['inbounds'][0];sec=i['streamSettings']['realitySettings']
            match={str(u) for r in s.get('routing',{}).get('rules',[]) if r.get('outboundTag')=='res-socks' for u in r.get('user',[])}
            clients=[c for c in i['settings']['clients'] if c.get('email') not in match]
            assert len(clients)==1 and clients[0].get('flow')=='xtls-rprx-vision'
            keys=subprocess.run(['/usr/local/bin/xray','x25519','-i',sec['privateKey']],capture_output=True,text=True,timeout=10)
            assert keys.returncode==0
            pub=''
            for line in keys.stdout.splitlines():
             if ':' in line:
              k,v=line.split(':',1)
              if k.lower().strip() in ('password','public key'): pub=v.strip()
            assert len(pub)>35
            sni=sec['serverNames'][0]
            raw={'log':{'loglevel':'warning'},'inbounds':[{'tag':'localtest','listen':'127.0.0.1','port':18085,'protocol':'socks','settings':{'auth':'noauth','udp':False}}],'outbounds':[{'tag':'rawtest','protocol':'vless','settings':{'vnext':[{'address':'127.0.0.1','port':443,'users':[{'id':clients[0]['id'],'encryption':'none','flow':'xtls-rprx-vision'}]}]},'streamSettings':{'network':'tcp','security':'reality','realitySettings':{'serverName':sni,'fingerprint':'chrome','password':pub,'shortId':next((x for x in sec.get('shortIds',[]) if x),''),'spiderX':'/'}}}]}
            f=d/'raw.json';f.write_text(json.dumps(raw));f.chmod(0o600)
            c=json.loads(pathlib.Path('/etc/myvps/xhttp-reality/client-test.json').read_text());
            assert c['outbounds'][0]['settings']['vnext'][0]['address']=='127.0.0.1'
            assert c['outbounds'][0]['settings']['vnext'][0]['port']==443
            assert c['inbounds'][0]['port']==18084
            print('original_reality_direct_identity_selected=yes')
            print('both_tests_same_vps_native_egress=yes')
            PY
            /usr/local/bin/xray run -test -config "$tempdir/raw.json" >/dev/null 2>&1; echo "raw_client_config_check=$?"
            /usr/local/bin/xray run -test -config /etc/myvps/xhttp-reality/client-test.json >/dev/null 2>&1; echo "xhttp_client_config_check=$?"
            /usr/local/bin/xray run -config "$tempdir/raw.json" >"$tempdir/raw.log" 2>&1 & rawpid=$!
            /usr/local/bin/xray run -config /etc/myvps/xhttp-reality/client-test.json >"$tempdir/xhttp.log" 2>&1 & xpid=$!
            sleep 2
            for entry in 'raw:18085' 'xhttp:18084'; do
             label=${entry%%:*}; port=${entry#*:}
             result=$(env -u HTTPS_PROXY -u HTTP_PROXY -u ALL_PROXY -u https_proxy -u http_proxy -u all_proxy curl -4 -sS --connect-timeout 9 --max-time 38 --socks5-hostname 127.0.0.1:$port -o /dev/null -w '%{http_code} %{size_download} %{time_total} %{speed_download}' 'https://speed.cloudflare.com/__down?bytes=20000000' 2>/dev/null)
             code=$?
             python3 - "$label" "$code" "$result" <<'PY'
            import sys
            label,exit_code,stats=sys.argv[1:]
            try:
             http,size,sec,speed=stats.split()
             print(f'{label}_curl_exit={exit_code}')
             print(f'{label}_http={http}')
             print(f'{label}_received_mb={float(size)/1e6:.2f}')
             print(f'{label}_seconds={float(sec):.3f}')
             print(f'{label}_mbps={float(speed)*8/1e6:.2f}')
            except Exception:print(label+'_test=NOT_COMPLETED')
            PY
            done
            echo '=== NO PRODUCTION CONFIGURATION CHANGED ==='
