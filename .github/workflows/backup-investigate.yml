name: Temporary latest cloud backup metadata check
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/backup-investigate.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only Google Drive backup age and count
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 90s
          script_stop: false
          script: |
            set +e
            export LC_ALL=C
            echo '=== DRIVE BACKUP METADATA (NO FILENAMES) ==='
            python3 - <<'PY'
            import subprocess,json,datetime
            remotes=subprocess.run(['rclone','listremotes'],text=True,capture_output=True,timeout=5).stdout.splitlines()
            for i,remote in enumerate(remotes[:3],1):
             if i!=2: continue
             try:
              x=subprocess.run(['rclone','lsjson','--recursive','--files-only','--max-depth','5',remote+'VPS-Backups'],capture_output=True,text=True,timeout=27)
              if x.returncode: print(f'remote_{i}_backup_listing=FAILED');continue
              data=json.loads(x.stdout)
              files=[j for j in data if not j.get('IsDir')]
              dates=[]
              for o in files:
               try: dates.append(datetime.datetime.fromisoformat(o['ModTime'].replace('Z','+00:00')))
               except Exception:pass
              print(f'remote_{i}_backup_file_count={len(files)}')
              print(f'remote_{i}_backup_total_bytes={sum(int(o.get("Size",0)) for o in files)}')
              if dates: print(f'remote_{i}_latest_backup_modified_utc={max(dates).isoformat()}')
              print(f'remote_{i}_backup_metadata_only=yes')
             except subprocess.TimeoutExpired: print(f'remote_{i}_backup_listing=TIMEOUT')
             except Exception as e: print(f'remote_{i}_backup_listing={type(e).__name__}')
            PY
            echo '=== END ==='
