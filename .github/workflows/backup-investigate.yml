name: VPS backup root cause followup
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/backup-investigate.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect cron script identities and cloud backup paths without secrets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 230s
          script_stop: false
          script: |
            set +e
            export LC_ALL=C
            echo '=== CRON EXECUTABLES ==='
            python3 - <<'PY'
            import subprocess,shlex,os
            p=subprocess.run(['crontab','-l'],capture_output=True,text=True)
            for i,line in enumerate((v.strip() for v in p.stdout.splitlines() if v.strip() and not v.lstrip().startswith('#')),1):
             parts=line.split(None,5)
             if len(parts)<6:continue
             s=parts[5]
             try:t=shlex.split(s)
             except ValueError:t=s.split()
             exe=os.path.basename(t[0]) if t else 'none'
             program=os.path.basename(t[1]) if len(t)>1 and exe in ('bash','sh','python','python3','/bin/sh') else 'none'
             print(f'cron_{i}_command={exe} script_basename={program}')
            PY
            echo '=== RCLONE BACKEND TYPES (NO CONFIG DUMP) ==='
            python3 - <<'PY'
            import configparser,subprocess
            p=subprocess.run(['rclone','config','file'],text=True,capture_output=True)
            lines=[s.strip() for s in p.stdout.splitlines() if s.strip()]
            path=next((s for s in reversed(lines) if s.startswith('/')),None)
            if path:
             c=configparser.ConfigParser(interpolation=None); c.read(path)
             for i,name in enumerate(c.sections(),1):
              print('remote_'+str(i)+'_backend='+c[name].get('type','unknown'))
            else:print('remote_backend_info=unavailable')
            PY
            echo '=== CLOUD BACKUP PATH PROBES ==='
            i=0
            while IFS= read -r remote; do
             i=$((i+1)); [ "$i" -le 3 ] || break
             for p in 'VPS-Backups/racknerd/full' 'VPS-Backups/racknerd/blog' 'VPS-Backups' 'backup' 'backups'; do
              if timeout 7 rclone lsf --max-depth 1 "$remote$p" >/dev/null 2>&1; then echo "remote_${i}_path_${p//\//_}=ACCESSIBLE"; else echo "remote_${i}_path_${p//\//_}=NOT_ACCESSIBLE_OR_MISSING"; fi
             done
            done < <(rclone listremotes 2>/dev/null)
            echo '=== SYSTEM CRON BACKUP JOB CLASSIFICATION ==='
            python3 - <<'PY'
            from pathlib import Path
            for base in ('/etc/cron.d','/etc/cron.daily','/etc/cron.weekly','/etc/systemd/system'):
             p=Path(base)
             if not p.is_dir():continue
             found=[]
             for f in p.iterdir():
              if not f.is_file():continue
              if 'backup' in f.name.lower() or 'rclone' in f.name.lower(): found.append(f.name)
             print('location='+base+' related_job_count='+str(len(found)))
             for x in found[:10]:print(' related_job_name='+x)
            PY
            echo '=== CRON JOURNAL LATEST EVIDENCE ==='
            for label in 24h 7d; do
             duration='1 day ago'; [ "$label" = '7d' ] && duration='7 days ago'
             printf 'cron_cmd_count_%s=' "$label"
             journalctl -u cron --since "$duration" -o cat --no-pager 2>/dev/null | grep -c '(CRON) info (No MTA installed, discarding output)' || true
            done
            echo '=== FINISHED ==='
