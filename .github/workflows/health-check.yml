name: Temporary VPS chain and security audit
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/health-check.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only chain routing and firewall inspection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 180s
          script_stop: false
          script: |
            set +e
            export LC_ALL=C
            echo '=== XRAY CHAIN ROUTING ==='
            p=/etc/xray-racknerd-443/config.json
            if [ -r "$p" ] && command -v jq >/dev/null 2>&1; then
            jq -r '(.outbounds|map(select(.protocol=="socks"))|first|.tag) as $s | "socks_outbound_configured="+($s!=null|tostring),"socks_outbound_first="+(.outbounds[0].protocol=="socks"|tostring),"routing_rule_count="+((.routing.rules//[]|length)|tostring),"rules_to_socks="+([.routing.rules[]?|select(.outboundTag==$s)]|length|tostring),"socks_server_count="+([.outbounds[]?|select(.protocol=="socks")|.settings.servers[]?]|length|tostring),"socks_auth_user_count="+([.outbounds[]?|select(.protocol=="socks")|.settings.servers[]?.users[]?]|length|tostring),"inbound_security="+([.inbounds[]?.streamSettings?.security]|join(","))' "$p" 2>/dev/null
            python3 - <<'PY'
            import json,socket
            p='/etc/xray-racknerd-443/config.json'
            try:
              data=json.load(open(p))
              upstream=[a for o in data.get('outbounds',[]) if o.get('protocol')=='socks' for a in o.get('settings',{}).get('servers',[])]
              for i,s in enumerate(upstream[:3],1):
                host=s.get('address'); port=s.get('port')
                if not host or not port: print(f'upstream_{i}=MISSING_HOST_OR_PORT'); continue
                try:
                  sock=socket.create_connection((host,int(port)),timeout=5); sock.close(); print(f'upstream_{i}=TCP_CONNECTED')
                except TimeoutError: print(f'upstream_{i}=TCP_TIMEOUT')
                except ConnectionRefusedError: print(f'upstream_{i}=TCP_REFUSED')
                except OSError as e: print(f'upstream_{i}=NETWORK_{type(e).__name__}')
            except (OSError,ValueError) as e: print('upstream_check=CONFIG_UNREADABLE')
            PY
            fi
            echo '=== 443 NGINX STREAM ==='
            if command -v ss >/dev/null 2>&1; then
             for port in 80 443 3000; do
              owner=$(ss -H -lntp | awk -v p="$port" '$4 ~ ":"p"$" {print $0;exit}' | sed -nE 's/.*users:\(\("([^"]+)".*/\1/p')
              echo "listener_${port}_process=$owner"
             done
            fi
            if command -v nginx >/dev/null 2>&1; then
             conf=$(nginx -T 2>/dev/null)
             echo "nginx_stream_sections=$(printf '%s\n' "$conf" | grep -Ec '^[[:space:]]*stream[[:space:]]*\{' || true)"
             echo "nginx_proxy_pass_lines=$(printf '%s\n' "$conf" | grep -Ec '^[[:space:]]*proxy_pass[[:space:]]+' || true)"
            fi
            echo '=== SECURITY SSL ==='
            if command -v fail2ban-client >/dev/null 2>&1; then
             fail2ban-client status 2>/dev/null | sed -nE 's/.*Number of jail:[[:space:]]*([0-9]+).*/fail2ban_jails=\1/p'
            fi
            if command -v ufw >/dev/null 2>&1; then ufw status | head -1 | sed 's/^/ufw_state=/'; else echo ufw=not_installed; fi
            if command -v nft >/dev/null 2>&1; then echo nft=installed; fi
            if command -v iptables >/dev/null 2>&1; then echo iptables=installed; fi
            if command -v openssl >/dev/null 2>&1; then
             for dir in /etc/letsencrypt/live /etc/nginx/ssl; do
              if [ -d "$dir" ]; then
               printf 'tls_directory_%s=present\n' "$(basename "$dir")"
               find "$dir" -maxdepth 2 -name fullchain.pem -type l 2>/dev/null | while read -r cert; do
                 if openssl x509 -checkend 2592000 -noout -in "$cert" >/dev/null 2>&1; then echo 'tls_cert=valid_over_30_days'; else echo 'tls_cert=expires_within_30_days_or_unreadable'; fi
               done
              fi
             done
            fi
            echo '=== CRON SYSTEM WIDE ==='
            printf 'root_cron_count='; (crontab -l 2>/dev/null || true) | awk 'NF && $1 !~ /^#/{n++}END{print n+0}'
            printf 'etc_cron_backup_refs='; grep -R -El '(rclone|backup)' /etc/cron.d /etc/cron.daily /etc/crontab 2>/dev/null | wc -l
            printf 'system_backup_timers='; systemctl list-timers --all --no-legend 2>/dev/null | grep -Eic 'backup|rclone' || true
            printf 'rclone_remotes_count='; rclone listremotes 2>/dev/null | wc -l
            echo '=== END SECOND PASS ==='
