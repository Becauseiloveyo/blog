name: Temporary live VPS manager structure report
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/manager-survey.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Collect sanitized manager structure (no config or credentials dumped)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 130s
          script_stop: false
          script: |
            set +e
            export LC_ALL=C
            echo '=== VPS LIVE MANAGER STRUCTURE ==='
            for f in /root/my_vps_manager.sh /root/my_vps_exit_manager.sh /root/my_vps_cf_ws_manager.sh /usr/local/bin/myvps /usr/local/bin/myvps-cf; do
             if [ -f "$f" ]; then
               echo "file_present=$(basename "$f")"
               stat -c 'size_bytes=%s date=%y' "$f" | cut -d. -f1
               printf 'version_tokens='; grep -E '^[[:space:]]*(VERSION|SCRIPT_VERSION)=' "$f" 2>/dev/null | sed -E 's/^.*=//' | tr -d '"\047' | tr '\n' ','; echo
               printf 'function_names='; grep -E '^[A-Za-z_][A-Za-z_0-9]*[[:space:]]*\(\)[[:space:]]*\{' "$f" 2>/dev/null | sed -E 's/[[:space:]]*\(\).*//' | tr '\n' ','; echo
               printf 'parse_status='; bash -n "$f" && echo PASS || echo FAIL
             else echo "file_missing=$(basename "$f")"; fi
            done
            echo '=== CHAIN ROUTING SUMMARY ==='
            if command -v jq >/dev/null 2>&1; then
             jq -r '[.outbounds[]?|{tag,protocol}]|map((.tag//"-")+"="+(.protocol//"-"))|join(",")|"outbounds="+.' /etc/xray-racknerd-443/config.json 2>/dev/null
             jq -r '[(.routing.rules//[])[]?|{type:(.type//"field"),outboundTag,has_inbound:has("inboundTag"),has_domain:has("domain"),has_ip:has("ip")} ]|map((.outboundTag//"-")+":inbound="+(.has_inbound|tostring)+":domain="+(.has_domain|tostring)+":ip="+(.has_ip|tostring))|join(",")|"routes="+.' /etc/xray-racknerd-443/config.json 2>/dev/null
            fi
            echo '=== BACKUP STATUS ==='
            printf 'backup_companion_present='; test -x /opt/myvps/backup/myvps_backup.sh && echo yes || echo no
            for t in myvps-backup-config.timer myvps-backup-blog.timer; do printf '%s=' "$t"; systemctl is-enabled "$t" 2>/dev/null; done
            echo '=== SITE / NGINX / PROCESS ==='
            printf 'nginx_stream_count='; nginx -T 2>/dev/null | grep -Ec '^[[:space:]]*stream[[:space:]]*\{' || true
            for svc in nginx xray-racknerd-443 fail2ban; do printf '%s=' "$svc"; systemctl is-active "$svc" || true; done
            echo '=== END ==='
