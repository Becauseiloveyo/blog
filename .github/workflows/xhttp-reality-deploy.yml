name: XHTTP REALITY stable target deployment and verification
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-reality-deploy.yml
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install verified XHTTP REALITY with Cloudflare fallback site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 45s
          command_timeout: 430s
          script_stop: false
          script: |
            set -Eeuo pipefail
            umask 077
            root='/etc/myvps/xhttp-reality'
            backup="$root/restore-before-cloudflare-target"
            ng_back="$root/nginx-443-sni.before-cloudflare-target.conf"
            phase='start'
            client_pid=''
            cleanup_and_rollback() {
             local rc=$?
             trap - EXIT
             if [ -n "$client_pid" ]; then kill "$client_pid" >/dev/null 2>&1 || true; wait "$client_pid" >/dev/null 2>&1 || true; fi
             if [ "$rc" -ne 0 ]; then
              echo 'deployment_result=FAIL; rollback_requested=yes'
              if [ "$phase" = nginx_modified ] || [ "$phase" = nginx_reloaded ]; then
               test ! -f "$ng_back" || cp -a "$ng_back" /etc/nginx/stream.d/443-sni.conf
               nginx -t >/dev/null 2>&1 && systemctl reload nginx || true
              fi
              systemctl disable --now myvps-xhttp-reality.service >/dev/null 2>&1 || true
              rm -f /etc/systemd/system/myvps-xhttp-reality.service
              systemctl daemon-reload >/dev/null 2>&1 || true
              if [ -d "$backup" ]; then for f in config.json client-test.json client-domain.json client-meta.json client-uri.txt; do cp -a "$backup/$f" "$root/$f"; done; fi
              echo 'rollback_attempted=yes'
             fi
             exit "$rc"
            }
            trap cleanup_and_rollback EXIT
            echo '=== RESTORE ALTERNATE REALITY XHTTP TESTED CONFIG ==='
            test -f "$root/client-uri.txt"
            test ! -e /etc/systemd/system/myvps-xhttp-reality.service
            test "$(systemctl is-active nginx)" = active
            for svc in xray-racknerd-443 xray-racknerd-cf-ws myvps-xhttp; do systemctl is-active --quiet "$svc"; done
            ! ss -H -lnt | awk '{print $4}' | grep -q ':24444$'
            test ! -e "$ng_back"
            install -d -m 700 "$backup"
            for f in config.json client-test.json client-domain.json client-meta.json client-uri.txt; do cp -a "$root/$f" "$backup/$f"; done
            python3 - <<'PYEDIT'
            from pathlib import Path
            import json,urllib.parse,os
            root=Path('/etc/myvps/xhttp-reality')
            sni='www.cloudflare.com'
            for name in ('config.json','client-test.json','client-domain.json'):
             p=root/name
             obj=json.loads(p.read_text())
             if name=='config.json':
              obj['inbounds'][0]['streamSettings']['realitySettings']['target']=sni+':443'
              obj['inbounds'][0]['streamSettings']['realitySettings']['serverNames']=[sni]
             else: obj['outbounds'][0]['streamSettings']['realitySettings']['serverName']=sni
             p.write_text(json.dumps(obj,indent=2)+'\n')
             os.chmod(p,0o600)
            meta=root/'client-meta.json'
            obj=json.loads(meta.read_text());obj['sni']=sni;meta.write_text(json.dumps(obj,indent=2)+'\n');os.chmod(meta,0o600)
            uri=root/'client-uri.txt';p=urllib.parse.urlsplit(uri.read_text().strip())
            q=dict(urllib.parse.parse_qsl(p.query));q['sni']=sni
            uri.write_text(urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,urllib.parse.urlencode(q),p.fragment))+'\n')
            os.chmod(uri,0o600)
            assert sni in json.loads((root/'client-domain.json').read_text())['outbounds'][0]['streamSettings']['realitySettings']['serverName']
            print('client_and_server_sni_compatibility_updated=yes')
            PYEDIT
            /usr/local/bin/xray run -test -config "$root/config.json" >/dev/null 2>&1
            /usr/local/bin/xray run -test -config "$root/client-test.json" >/dev/null 2>&1
            cat > /etc/systemd/system/myvps-xhttp-reality.service <<'UNIT'
            [Unit]
            Description=MyVPS XHTTP REALITY independent localhost backend
            Wants=network-online.target
            After=network-online.target
            [Service]
            Type=simple
            ExecStart=/usr/local/bin/xray run -config /etc/myvps/xhttp-reality/config.json
            Restart=on-failure
            RestartSec=3
            LimitNOFILE=16384
            NoNewPrivileges=true
            PrivateTmp=true
            [Install]
            WantedBy=multi-user.target
            UNIT
            chmod 644 /etc/systemd/system/myvps-xhttp-reality.service
            systemctl daemon-reload
            systemctl enable --now myvps-xhttp-reality.service >/dev/null
            sleep 1
            systemctl is-active --quiet myvps-xhttp-reality.service
            ss -H -lnt | awk '{print $4}' | grep -q '127.0.0.1:24444$'
            echo 'xhttp_reality_service=PASS'
            cp -a /etc/nginx/stream.d/443-sni.conf "$ng_back"
            python3 - <<'PYNG'
            from pathlib import Path
            p=Path('/etc/nginx/stream.d/443-sni.conf')
            s=p.read_text()
            assert s.count('map $ssl_preread_server_name $my_443_backend {')==1
            assert s.count('dl.google.com       xray_reality_backend;')==1
            assert s.count('default       local_https_backend;')==1
            assert 'www.cloudflare.com' not in s and 'xray_reality_xhttp_backend' not in s
            assert s.count('upstream xray_reality_backend { server 127.0.0.1:24443; }')==1
            s=s.replace('default       local_https_backend;','www.cloudflare.com xray_reality_xhttp_backend;\n    default       local_https_backend;',1)
            s=s.replace('upstream xray_reality_backend { server 127.0.0.1:24443; }','upstream xray_reality_backend { server 127.0.0.1:24443; }\nupstream xray_reality_xhttp_backend { server 127.0.0.1:24444; }',1)
            p.write_text(s)
            print('nginx_sni_443_route=added_for_new_backend')
            PYNG
            phase='nginx_modified'
            nginx -t >/dev/null 2>&1
            systemctl reload nginx
            phase='nginx_reloaded'
            echo 'nginx_sni_route=PASS'
            probe() {
             local label=$1 file=$2 http
             local dir
             dir=$(mktemp -d /var/tmp/myvps-new-xhttp-real-test.XXXXXXXX)
             /usr/local/bin/xray run -config "$root/$file" >"$dir/client.log" 2>&1 &
             client_pid=$!
             sleep 2
             if ! kill -0 "$client_pid" 2>/dev/null; then echo "probe_${label}=CLIENT_START_FAIL"; rm -rf "$dir"; return 1; fi
             http=$(curl -sS -4 --socks5-hostname 127.0.0.1:18084 --connect-timeout 12 --max-time 35 -o "$dir/out" -w '%{http_code}' https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
             if [ "$http" = 200 ] && grep -q '^ip=' "$dir/out"; then echo "probe_${label}=PASS_HTTP_200"; else echo "probe_${label}=FAIL_${http:-none}"; kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true; client_pid=''; rm -rf "$dir"; return 1; fi
             kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true; client_pid=''
             rm -rf "$dir"
            }
            echo '=== CHECK CLIENT THROUGH NGINX 443 WITH SNI ==='
            probe origin_443 client-test.json
            echo '=== CHECK CLIENT USING 2B DOMAIN ==='
            if probe domain_443 client-domain.json; then echo 'public_domain_self_test=PASS'; else echo 'public_domain_self_test=UNAVAILABLE_ON_SERVER; origin remains validated'; fi
            for svc in nginx xray-racknerd-443 xray-racknerd-cf-ws myvps-xhttp myvps-xhttp-reality; do systemctl is-active --quiet "$svc"; echo "service_${svc}=active"; done
            test "$(readlink -f /usr/local/bin/myvps)" = /root/my_vps_manager.sh
            stat -c 'client_uri_mode=%a' "$root/client-uri.txt"
            echo 'URI_RETRIEVAL=ssh root@198.44.104.23 cat /etc/myvps/xhttp-reality/client-uri.txt'
            echo 'xhttp_reality_install_result=PASS'
            trap - EXIT
