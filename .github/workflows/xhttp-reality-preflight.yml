name: Temporary safe stream SNI map detail
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-reality-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Review nginx stream map keys for safe new SNI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 150s
          script_stop: false
          script: |
            set -Eeuo pipefail
            echo '=== NGINX STREAM 443 SANITIZED STRUCTURE ==='
            python3 - <<'PY'
            from pathlib import Path
            s=Path('/etc/nginx/stream.d/443-sni.conf').read_text()
            for i,line in enumerate(s.splitlines(),1):
             v=line.strip()
             if any(term in v.lower() for term in ('ssl_certificate','private','password','token','secret','uuid','key')): continue
             if v: print(str(i)+': '+v[:160])
            PY
            echo '=== BEFORE ==='
            for s in xray-racknerd-443 nginx; do echo "$s=$(systemctl is-active "$s")"; done
