name: Temporary XHTTP REALITY SNI routing preflight
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-reality-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect existing REALITY SNI routing without credentials
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 170s
          script_stop: false
          script: |
            set -Eeuo pipefail
            echo '=== REALITY XHTTP SAFE SNI ROUTE PREFLIGHT ==='
            printf 'nginx_config='; nginx -t >/dev/null 2>&1 && echo OK
            for s in nginx xray-racknerd-443 xray-racknerd-cf-ws myvps-xhttp; do printf 'service_%s=' "$s"; systemctl is-active "$s"; done
            for port in 24443 24444 24445 18081; do printf 'port_%s=' "$port"; ss -H -lnt | awk '{print $4}' | grep -Ec ":$port$" || true; done
            python3 - <<'PY'
            import pathlib,re,json,subprocess
            c=json.loads(pathlib.Path('/etc/xray-racknerd-443/config.json').read_text())
            for x in c.get('inbounds',[]):
             r=x.get('streamSettings',{}).get('realitySettings',{})
             if r:
              print('current_reality_inbound_port='+str(x.get('port')))
              print('current_reality_target='+str(r.get('target',r.get('dest',''))))
              print('current_reality_server_names='+','.join(r.get('serverNames',[])))
            n=subprocess.run(['nginx','-T'],capture_output=True,text=True,timeout=15).stdout
            for b in re.split(r'(?=# configuration file )',n):
             if not ('ssl_preread' in b or 'map $ssl_preread' in b or '24443' in b): continue
             label=b.splitlines()[0] if b.splitlines() else ''
             print('nginx_stream_source='+label[:180])
             for line in b.splitlines():
              v=line.strip()
              if re.match(r'^(map\s|upstream\s|server\s*\{|listen\s|ssl_preread\s|proxy_pass\s|default\s|~\S|[A-Za-z0-9.*_-]+\s+127\.0\.0\.1:\d+\s*;)',v):
               print('  route='+v[:180])
            PY
            echo '=== TARGET REACHABILITY ==='
            for host in dl.google.com www.cloudflare.com www.microsoft.com www.apple.com; do
             c=$(curl -sS --noproxy '*' --connect-timeout 5 --max-time 9 -o /dev/null -w '%{http_code}' "https://$host/" 2>/dev/null || true)
             echo "https_host_${host}=${c:-FAIL}"
            done
            echo '=== END PREFLIGHT ==='
