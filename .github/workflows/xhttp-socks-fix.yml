name: Temporary XHTTP REALITY residential chain fix
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-socks-fix.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Make XHTTP REALITY fail-closed to existing SOCKS and verify egress
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 230s
          script_stop: false
          script: |
            set -Eeuo pipefail
            umask 077
            echo '=== ENFORCE EXISTING SOCKS CHAIN FOR ISOLATED XHTTP REALITY ==='
            conf='/etc/myvps/xhttp-reality/config.json'
            backup="${conf}.before-socks-routing-$(date -u +%Y%m%dT%H%M%SZ)"
            test -r "$conf"
            systemctl is-active --quiet myvps-xhttp-reality
            cp -a "$conf" "$backup"
            client_pid=''
            finish() {
             rc=$?
             trap - EXIT
             if [ -n "$client_pid" ]; then kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true; fi
             if [ "$rc" -ne 0 ]; then
              echo 'xhttp_reality_exit_validation=FAIL; restoring prior config'
              cp -a "$backup" "$conf"
              systemctl restart myvps-xhttp-reality.service || true
             fi
             exit "$rc"
            }
            trap finish EXIT
            python3 - <<'PY'
            import json,os,pathlib
            p=pathlib.Path('/etc/myvps/xhttp-reality/config.json')
            config=json.loads(p.read_text())
            assert len(config.get('inbounds',[])) == 1 and config['inbounds'][0]['tag']=='xhttp-reality'
            original=config.get('outbounds',[])
            socks=[x for x in original if x.get('protocol')=='socks' and x.get('tag')=='res-socks']
            blocked=[x for x in original if x.get('protocol')=='blackhole']
            assert len(socks)==1 and len(blocked)>=1, 'missing socks or blackhole'
            assert len(socks[0].get('settings',{}).get('servers',[]))==1
            config['outbounds']=[socks[0],blocked[0]]
            config['routing']={'domainStrategy':'AsIs','rules':[{'type':'field','inboundTag':['xhttp-reality'],'outboundTag':'res-socks'}]}
            tmp=p.with_suffix('.next')
            with tmp.open('x') as f:json.dump(config,f,indent=2)
            os.chmod(tmp,0o600)
            os.replace(tmp,p)
            print('xhttp_reality_first_outbound=socks')
            print('xhttp_reality_direct_fallback=DISABLED')
            print('xhttp_reality_rule=inboundTag_to_res-socks')
            PY
            /usr/local/bin/xray run -test -config "$conf" >/dev/null 2>&1
            systemctl restart myvps-xhttp-reality.service
            sleep 1
            systemctl is-active --quiet myvps-xhttp-reality.service
            echo 'new_xhttp_reality_routing_service=ACTIVE'
            dir=$(mktemp -d /var/tmp/myvps-xhttp-exit-check.XXXXXXXX)
            trap 'rm -rf "$dir"' RETURN
            /usr/local/bin/xray run -config /etc/myvps/xhttp-reality/client-test.json > "$dir/client.log" 2>&1 &
            client_pid=$!
            sleep 2
            kill -0 "$client_pid" 2>/dev/null
            native=$(curl -sS -4 --noproxy '*' --connect-timeout 9 --max-time 17 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p' | head -1)
            curl -sS -4 --socks5-hostname 127.0.0.1:18084 --connect-timeout 12 --max-time 35 https://www.cloudflare.com/cdn-cgi/trace -o "$dir/proxied.txt"
            proxy=$(sed -n 's/^ip=//p' "$dir/proxied.txt" | head -1)
            test -n "$native" && test -n "$proxy"
            if [ "$native" = "$proxy" ]; then echo 'xhttp_reality_exit_is_not_native=FALSE'; exit 44; else echo 'xhttp_reality_exit_is_not_native=TRUE'; fi
            test "$(systemctl is-active nginx)" = active
            test "$(systemctl is-active xray-racknerd-443)" = active
            test "$(systemctl is-active xray-racknerd-cf-ws)" = active
            test "$(systemctl is-active myvps-xhttp)" = active
            echo 'xhttp_reality_res_socks_outbound=VERIFIED'
            echo 'legacy_services=UNMODIFIED_ACTIVE'
            echo '=== COMPLETE ==='
            rm -rf "$dir"
            trap - EXIT
