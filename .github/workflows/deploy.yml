name: Deploy Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            if [ ! -d "$HOME/my-blog/.git" ]; then
              rm -rf "$HOME/my-blog"
              git clone https://github.com/Becauseiloveyo/blog.git "$HOME/my-blog"
            fi
            cd "$HOME/my-blog"
            git fetch --all
            git reset --hard origin/main
            npm install --omit=dev
            pm2 restart moyan-blog || pm2 start server.js --name moyan-blog
            pm2 save
