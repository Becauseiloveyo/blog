name: Temporary REALITY routing and TCP diagnostics
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/temp-reality-speed-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose REALITY route and congestion without disclosing users
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 120s
          script_stop: false
          script: |
            set -Eeuo pipefail
            echo '=== ORIGINAL REALITY ROUTING AUDIT ==='
            python3 - <<'PY'
            from pathlib import Path
            import json
            cfg=json.loads(Path('/etc/xray-racknerd-443/config.json').read_text())
            inbs=[i for i in cfg.get('inbounds',[]) if i.get('protocol')=='vless']
            outs=cfg.get('outbounds',[])
            print('vless_inbound_count='+str(len(inbs)))
            print('first_outbound_protocol='+str(outs[0].get('protocol') if outs else 'NONE'))
            print('socks_outbound_count='+str(sum(o.get('protocol')=='socks' for o in outs)))
            for j,ib in enumerate(inbs,1):
             clients=ib.get('settings',{}).get('clients',[])
             names={str(x.get('email','')) for x in clients if x.get('email')}
             print(f'inbound_{j}_network='+str(ib.get('streamSettings',{}).get('network','tcp')))
             print(f'inbound_{j}_client_count='+str(len(clients)))
             print(f'inbound_{j}_clients_with_email='+str(len(names)))
             print(f'inbound_{j}_vision_client_count='+str(sum(x.get('flow')=='xtls-rprx-vision' for x in clients)))
             matched=set()
             for k,r in enumerate(cfg.get('routing',{}).get('rules',[]),1):
              users=set(map(str,r.get('user',[])))
              socks=r.get('outboundTag') in {o.get('tag') for o in outs if o.get('protocol')=='socks'}
              if socks: matched|=(names & users)
              print(f'route_{k}_match_types='+','.join(x for x in ('user','inboundTag','domain','ip','port','network','protocol','source','attrs') if x in r))
              print(f'route_{k}_outbound_is_socks='+str(socks))
             print(f'inbound_{j}_client_email_matches_socks_rule='+str(len(matched)))
             print(f'inbound_{j}_client_email_not_matching_socks_rule='+str(len(names-matched)))
            PY
            echo '=== NETWORK TRANSPORT ==='
            printf 'cc='; sysctl -n net.ipv4.tcp_congestion_control
            printf 'mtu='; cat /sys/class/net/eth0/mtu
            printf 'tcp_rmem='; sysctl -n net.ipv4.tcp_rmem
            printf 'tcp_wmem='; sysctl -n net.ipv4.tcp_wmem
            printf 'rtt_distribution_ms='; ss -tin state established | sed -n 's/.*rtt:\([0-9.]*\)\/\([0-9.]*\).*/\1/p' | awk 'NR<=350{a[NR]=$1} END{n=NR;if(n==0){print "none";exit} asort(a);printf "p50=%s p90=%s n=%d\n",a[int(n*.5)+1],a[int(n*.9)+1],n}' 2>/dev/null || echo unavailable
            echo '=== COUNTER SNAPSHOT ==='
            python3 - <<'PY'
            from pathlib import Path
            s=Path('/proc/net/snmp').read_text().splitlines()
            for i,line in enumerate(s[:-1]):
             if line.startswith('Tcp:') and s[i+1].startswith('Tcp:'):
              d=dict(zip(line.split()[1:],s[i+1].split()[1:]));print('tcp_retrans_segments_cumulative='+d.get('RetransSegs','n/a')); print('tcp_out_segments_cumulative='+d.get('OutSegs','n/a'));break
            PY
            echo '=== DONE ==='
