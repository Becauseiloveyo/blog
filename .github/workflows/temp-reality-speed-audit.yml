name: Temporary bounded download comparison
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/temp-reality-speed-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare bounded 20MB native vs chained SOCKS egress without logging secrets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 180s
          script_stop: false
          script: |
            set -Eeuo pipefail
            echo '=== SHORT BOUNDED VPS DIRECT VS RES SOCKS THROUGHPUT ==='
            python3 - <<'PY'
            import json, subprocess, time, os, pathlib, urllib.parse
            cfg=json.loads(pathlib.Path('/etc/xray-racknerd-443/config.json').read_text())
            so=[o for o in cfg.get('outbounds',[]) if o.get('protocol')=='socks' and o.get('tag')=='res-socks']
            assert len(so)==1
            servers=so[0].get('settings',{}).get('servers',[])
            assert len(servers)==1
            server=servers[0]
            auth=server.get('users',[])
            assert len(auth)<=1
            opts=[]
            if auth:
             u=auth[0]
             assert 'user' in u and 'pass' in u
             opts=['--proxy-user',u['user']+':'+u['pass']]
            proxy=server['address']+':'+str(server['port'])
            tests=[('native_direct',None),('res_socks',proxy)]
            url='https://speed.cloudflare.com/__down?bytes=20000000'
            def retrans():
             lines=pathlib.Path('/proc/net/snmp').read_text().splitlines()
             for i,l in enumerate(lines[:-1]):
              if l.startswith('Tcp:') and lines[i+1].startswith('Tcp:'):
               m=dict(zip(l.split()[1:],lines[i+1].split()[1:]));return int(m.get('RetransSegs','0'))
             return 0
            for label,host in tests:
             args=['curl','-4','-sS','--noproxy','*','--connect-timeout','9','--max-time','38','--output','/dev/null','--write-out','%{http_code}|%{size_download}|%{time_connect}|%{time_starttransfer}|%{time_total}|%{speed_download}',url]
             if host:
              args=[x for x in args if x not in ['--noproxy','*']]
              args[1:1]=['--socks5-hostname',host]+opts
             env={k:v for k,v in os.environ.items() if not k.upper().endswith('_PROXY')}
             start=retrans()
             try:
              r=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=45,env=env)
              code,byte,conn,ttfb,seconds,speed=r.stdout.strip().split('|')
              print(label+'_curl_exit='+str(r.returncode))
              print(label+'_http_code='+code)
              print(label+'_mb_downloaded='+format(float(byte)/1e6,'.2f'))
              print(label+'_elapsed_sec='+format(float(seconds),'.2f'))
              print(label+'_avg_mbps='+format(float(speed)*8/1e6,'.2f'))
              print(label+'_ttfb_sec='+format(float(ttfb),'.2f'))
             except Exception as e:print(label+'_test=ERROR_'+type(e).__name__)
             end=retrans()
             print(label+'_system_tcp_retrans_delta='+str(end-start))
            PY
            echo '=== NO SERVER CONFIGURATION CHANGED ==='
