name: Temporary backup preflight inspection
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/backup-preflight.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only backup scope preflight
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 150s
          script_stop: false
          script: |
            set +e
            export LC_ALL=C
            echo '=== CONFIG AND SIZE PRECHECK ==='
            for path in /root/my-blog /root/my-blog/data /root/my-blog/public/uploads /root/.pm2 /etc/nginx /etc/xray-racknerd-443 /opt /etc/myvps /etc/myvps/backup.pass; do
             if [ -d "$path" ]; then
              size=$(du -sm -s "$path" 2>/dev/null | awk '{print $1}')
              echo "directory=$(basename "$path") parent=$(basename "$(dirname "$path")") size_mb=$size"
             elif [ -f "$path" ]; then echo "file=$(basename "$path") present=yes"
             else echo "missing=$(basename "$path") parent=$(basename "$(dirname "$path")")"; fi
            done
            echo '=== APP DATA TYPES ==='
            for f in /root/my-blog/package.json /root/my-blog/.env /root/my-blog/data/database.sqlite /root/my-blog/data/blog.db /root/my-blog/data/database.db; do
             if [ -f "$f" ]; then echo "app_file_$(basename "$f")=yes"; fi
            done
            if command -v sqlite3 >/dev/null 2>&1; then echo sqlite3_available=yes; else echo sqlite3_available=no; fi
            if command -v mysqldump >/dev/null 2>&1; then echo mysqldump_available=yes; else echo mysqldump_available=no; fi
            echo '=== EXISTING KEY AND RCLONE ==='
            if [ -s /etc/myvps/backup.pass ]; then echo existing_backup_key=yes; else echo existing_backup_key=no; fi
            i=0
            while IFS= read -r remote; do
             i=$((i+1))
             printf 'remote_%s_type=' "$i"; rclone config show "$remote" 2>/dev/null | sed -n 's/^type = / /p' | head -1
            done < <(rclone listremotes 2>/dev/null)
            echo '=== SYSTEMD CALENDAR SUPPORT ==='
            systemd-analyze calendar '*-*-* 02:00:00 Asia/Shanghai' 2>/dev/null | grep -E 'Normalized form|Next elapse' | sed -E 's/.*:/calendar=/'
            echo '=== KEY BUSINESS PROCESS ==='
            pm2 jlist 2>/dev/null | jq -r '.[]| "app="+(.name//"-")+" status="+(.pm2_env.status//"-")' 2>/dev/null
            echo '=== END ==='
