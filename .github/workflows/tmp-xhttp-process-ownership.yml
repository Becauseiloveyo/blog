name: Temporary systemd XHTTP ownership audit
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/tmp-xhttp-process-ownership.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify if XHTTP belongs to systemd and detect leftover test clients
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 120s
          script_stop: false
          script: |
            set +e
            echo '=== XHTTP SYSTEMD OWNERSHIP ==='
            for s in myvps-xhttp-reality.service myvps-xhttp.service xray-racknerd-443.service myvps-backup-watch.service myvps-backup-watch.timer; do
              echo "unit=$s"
              systemctl show "$s" -p LoadState -p ActiveState -p SubState -p MainPID -p NRestarts -p Result -p FragmentPath --no-pager 2>/dev/null | sed -E 's#(FragmentPath=).*#\1<present-or-absent>#' | tr '\n' ';'; echo
            done
            echo '=== XRAY PROCESSES (NO ARGUMENTS OR SECRETS) ==='
            for p in $(pgrep -x xray || true); do
              test -r "/proc/$p/status" || continue
              n=$(awk '/^Name:/{print $2}' /proc/$p/status)
              parent=$(awk '/^PPid:/{print $2}' /proc/$p/status)
              cg=$(sed -n '1s#.*:/##p' /proc/$p/cgroup)
              echo "xray_pid=$p parent=$parent cgroup=$cg"
            done
            echo '=== CLIENT TEST LEFTOVERS ==='
            for f in /etc/myvps/xhttp-reality/client-test.json /etc/myvps/xhttp-reality/client-domain.json; do
             cnt=0
             for p in $(pgrep -x xray || true); do
               if tr '\0' '\n' < "/proc/$p/cmdline" 2>/dev/null | grep -Fxq "$f"; then cnt=$((cnt+1));echo "client_test_process=$p file_basename=$(basename "$f")";fi
             done
             echo "client_file_basename=$(basename "$f") count=$cnt"
            done
            echo '=== LOCAL TEST PORT (NO IP ADDRESSES) ==='
            ss -H -lntp '( sport = :18084 )' 2>/dev/null | awk '{print "port_18084_listener=yes"}' | head -3
            echo '=== BACKUP WATCH FAILURE LAST RUN ==='
            systemctl show myvps-backup-watch.service -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp --no-pager 2>/dev/null
            journalctl -u myvps-backup-watch.service --no-pager -o cat -n 20 2>/dev/null | grep -E 'BACKUP_ALERT|backup_watch=|config: |blog: ' | tail -10
            echo '=== END ==='
