name: One-time VPS SSH key enrollment

on:
  push:
    branches:
      - ssh-key-grant-20261108
    paths:
      - .github/workflows/add-vps-ssh-key.yml

permissions:
  contents: read

jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add specified public key to the deployment user
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            PUBKEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBL3l1ssmBFEA2UrylTjvv3AzauRStYRB5SbYyJQeIx3 hatch'
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
            if grep -Fqx -- "$PUBKEY" "$HOME/.ssh/authorized_keys"; then
              printf '%s\n' 'Public key already present'
            else
              printf '%s\n' "$PUBKEY" >> "$HOME/.ssh/authorized_keys"
              printf '%s\n' 'Public key enrolled'
            fi
