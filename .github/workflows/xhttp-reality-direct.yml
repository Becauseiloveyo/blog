name: Temporary XHTTP REALITY direct egress switch
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-reality-direct.yml
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Switch only XHTTP REALITY to native VPS egress and verify with rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 230s
          script_stop: false
          script: |
            set -Eeuo pipefail
            umask 077
            echo '=== XHTTP REALITY: RESTORE NATIVE VPS EGRESS ==='
            cfg='/etc/myvps/xhttp-reality/config.json'
            test -f "$cfg"
            systemctl is-active --quiet myvps-xhttp-reality.service
            systemctl is-active --quiet xray-racknerd-443.service
            systemctl is-active --quiet myvps-xhttp.service
            systemctl is-active --quiet nginx.service
            old_xray_sha=$(sha256sum /etc/xray-racknerd-443/config.json | cut -d ' ' -f1)
            cdn_xhttp_sha=$(sha256sum /etc/myvps/xhttp/config.json | cut -d ' ' -f1)
            backup="${cfg}.before-direct-$(date -u +%Y%m%dT%H%M%SZ)"
            cp -a "$cfg" "$backup"
            client_pid=''
            test_dir=''
            rollback() {
              code=$?
              trap - EXIT
              if [ -n "$client_pid" ]; then kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true; fi
              if [ -n "$test_dir" ]; then rm -rf "$test_dir"; fi
              if [ "$code" -ne 0 ]; then
                echo 'deployment=FAILED; restoring prior XHTTP REALITY config'
                cp -a "$backup" "$cfg"
                systemctl restart myvps-xhttp-reality.service || true
              fi
              exit "$code"
            }
            trap rollback EXIT
            python3 - <<'PY'
            import pathlib,json,os
            p=pathlib.Path('/etc/myvps/xhttp-reality/config.json')
            cfg=json.loads(p.read_text())
            assert len(cfg.get('inbounds',[]))==1 and cfg['inbounds'][0]['tag']=='xhttp-reality'
            assert cfg['inbounds'][0].get('streamSettings',{}).get('network')=='xhttp'
            assert cfg['inbounds'][0].get('streamSettings',{}).get('security')=='reality'
            assert any(x.get('tag')=='res-socks' for x in cfg.get('outbounds',[])), 'Expected existing residential chain'
            bl=[x for x in cfg['outbounds'] if x.get('protocol')=='blackhole']
            assert len(bl)==1
            cfg['outbounds']=[{'tag':'direct','protocol':'freedom','settings':{}},bl[0]]
            cfg['routing']={'domainStrategy':'AsIs','rules':[{'type':'field','inboundTag':['xhttp-reality'],'outboundTag':'direct'}]}
            temp=p.with_suffix('.direct-next')
            with temp.open('x') as f:json.dump(cfg,f,indent=2);f.write('\n')
            os.chmod(temp,0o600)
            os.replace(temp,p)
            assert not any(o['protocol']=='socks' for o in cfg['outbounds'])
            print('xhttp_reality_outbound=freedom')
            print('xhttp_reality_residential_proxy=REMOVED')
            print('xhttp_reality_route=EXPLICIT_DIRECT')
            PY
            /usr/local/bin/xray run -test -config "$cfg" >/dev/null 2>&1
            echo 'xray_config_check=PASS'
            systemctl restart myvps-xhttp-reality.service
            sleep 2
            systemctl is-active --quiet myvps-xhttp-reality.service
            echo 'service_after_restart=ACTIVE'
            test_dir=$(mktemp -d /var/tmp/myvps-xhttp-native-test.XXXXXXXX)
            /usr/local/bin/xray run -config /etc/myvps/xhttp-reality/client-test.json >"$test_dir/client.log" 2>&1 &
            client_pid=$!
            sleep 2
            kill -0 "$client_pid" 2>/dev/null
            native_trace=$(env -u ALL_PROXY -u HTTPS_PROXY -u HTTP_PROXY -u all_proxy -u https_proxy -u http_proxy curl --noproxy '*' -sS -4 --connect-timeout 12 --max-time 25 https://www.cloudflare.com/cdn-cgi/trace)
            echo "$native_trace" > "$test_dir/native.txt"
            env -u ALL_PROXY -u HTTPS_PROXY -u HTTP_PROXY -u all_proxy -u https_proxy -u http_proxy curl --socks5-hostname 127.0.0.1:18084 -sS -4 --connect-timeout 12 --max-time 35 https://www.cloudflare.com/cdn-cgi/trace -o "$test_dir/newnode.txt"
            native_ip=$(sed -n 's/^ip=//p' "$test_dir/native.txt" | head -1 | tr -d '\r')
            node_ip=$(sed -n 's/^ip=//p' "$test_dir/newnode.txt" | head -1 | tr -d '\r')
            test -n "$native_ip"
            test -n "$node_ip"
            if [ "$native_ip" = "$node_ip" ]; then echo 'xhttp_reality_egress_matches_native_vps=PASS'; else echo 'xhttp_reality_egress_matches_native_vps=FAIL'; exit 41; fi
            test "$old_xray_sha" = "$(sha256sum /etc/xray-racknerd-443/config.json | cut -d ' ' -f1)"
            test "$cdn_xhttp_sha" = "$(sha256sum /etc/myvps/xhttp/config.json | cut -d ' ' -f1)"
            echo 'other_xray_configs=UNCHANGED'
            for s in nginx xray-racknerd-443 xray-racknerd-cf-ws myvps-xhttp myvps-xhttp-reality; do systemctl is-active --quiet "$s"; echo "service_$s=active"; done
            echo 'vless_client_link=UNCHANGED'
            echo '=== VERIFIED DIRECT XHTTP REALITY ==='
            trap - EXIT
            if [ -n "$client_pid" ]; then kill "$client_pid" 2>/dev/null || true; wait "$client_pid" 2>/dev/null || true; fi
            rm -rf "$test_dir"
