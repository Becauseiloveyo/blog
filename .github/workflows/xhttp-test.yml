name: Temporary XHTTP client root cause and CDN test
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose origin settings and test CDN route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 120s
          script_stop: false
          script: |
            set +e
            echo '=== XHTTP CLIENT VALIDATION ERROR CLASS ==='
            python3 - <<'PY'
            import json,subprocess,pathlib
            root=pathlib.Path('/etc/myvps/xhttp'); info=json.loads((root/'client-info.json').read_text())
            p=subprocess.run(['/usr/local/bin/xray','run','-test','-config',str(root/'client-origin.json')],capture_output=True,text=True,timeout=12)
            s=p.stdout+'\n'+p.stderr
            for v in (info.get('uuid',''),info.get('path','')):
             if v:s=s.replace(v,'[redacted]')
            for part in s.split(' > '):
             if 'Failed to start:' in part or 'failed to build' in part or 'not support' in part or 'is not allowed' in part:
              print('config_error_part='+part.strip()[:350])
            PY
            echo '=== TEST CDN CLIENT ==='
            /usr/local/bin/xray run -config /etc/myvps/xhttp/client-cdn.json >/var/tmp/myvps-xhttp-cdn-diagnostic.log 2>&1 &
            pid=$!
            sleep 2
            if kill -0 "$pid" 2>/dev/null; then
             out=$(curl -sS -4 --socks5-hostname 127.0.0.1:18082 --connect-timeout 10 --max-time 22 -o /dev/null -w '%{http_code}' https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null)
             echo "cdn_http_code=$out"
            else echo cdn_client=START_FAIL; fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f /var/tmp/myvps-xhttp-cdn-diagnostic.log
            echo '=== END ==='
