name: Temporary XHTTP client configuration diagnostics
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/xhttp-test.yml
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose client config with sensitive values redacted
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 120s
          script_stop: false
          script: |
            set +e
            echo '=== SANITIZED XHTTP CLIENT VALIDATION ==='
            python3 - <<'PY'
            import subprocess,json,pathlib,re
            root=pathlib.Path('/etc/myvps/xhttp')
            info=json.loads((root/'client-info.json').read_text())
            for mode in ('origin','cdn'):
             f=root/('client-'+mode+'.json')
             p=subprocess.run(['/usr/local/bin/xray','run','-test','-config',str(f)],capture_output=True,text=True,timeout=18)
             t=p.stdout+'\n'+p.stderr
             for secret in (info.get('uuid',''),info.get('path','')):
              if secret:t=t.replace(secret,'[redacted]')
             t=re.sub(r'(?i)(password|token|privatekey)\s*[:=]\s*\S+',r'\1=[redacted]',t)
             print(f'client_{mode}_config_check='+('PASS' if p.returncode==0 else 'FAIL'))
             if p.returncode!=0:
              for line in t.splitlines()[-6:]: print('diagnostic='+line[:180])
            PY
            echo '=== SERVICE STILL ACTIVE ==='
            for s in nginx xray-racknerd-443 xray-racknerd-cf-ws myvps-xhttp; do echo "$s=$(systemctl is-active "$s")"; done
