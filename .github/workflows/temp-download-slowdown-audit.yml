name: Temporary TCP port aggregation audit
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/temp-download-slowdown-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Aggregate established TCP connections without printing IPs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 35s
          command_timeout: 100s
          script_stop: false
          script: |
            set +e
            echo '=== TCP CONNECTION BREAKDOWN READ ONLY ==='
            python3 - <<'PY'
            from collections import Counter
            from pathlib import Path
            import ipaddress
            ss=Path('/proc/net/tcp').read_text().splitlines()[1:]
            ss6=Path('/proc/net/tcp6').read_text().splitlines()[1:]
            local=Counter();remote=Counter();state=Counter();peers=Counter();lport_active=Counter()
            for line in ss+ss6:
             a=line.split()
             if len(a)<4:continue
             st=a[3];state[st]+=1
             if st!='01':continue
             lp=int(a[1].split(':')[1],16); rp=int(a[2].split(':')[1],16)
             local[lp]+=1;remote[rp]+=1
             peers[a[2].split(':')[0]]+=1
            for port,n in local.most_common(12):
             p=str(port) if port in (80,443,3000,10443,24443,24444,18081,18084,22) else 'ephemeral'
             lport_active[p]+=n
            print('tcp_established_by_local_port='+str(dict(lport_active)))
            print('tcp_established_by_remote_port='+str(remote.most_common(8)))
            print('tcp_distinct_remote_address_count='+str(len(peers)))
            print('tcp_max_connections_single_remote_address='+str(max(peers.values(),default=0)))
            print('tcp_states_hex='+str(dict(state)))
            PY
            echo '=== NETDEV ERROR COUNTERS ==='
            for c in rx_errors tx_errors rx_dropped tx_dropped; do printf '%s=' "$c"; cat "/sys/class/net/eth0/statistics/$c"; done
            echo '=== END ==='
