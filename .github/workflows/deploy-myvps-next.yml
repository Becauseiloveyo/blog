name: Temporary non-invasive MyVPS v2.3 deploy
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/deploy-myvps-next.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install separate myvps-next and validate existing production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 40s
          command_timeout: 240s
          script_stop: true
          script: |
            set -Eeuo pipefail
            umask 077
            echo '=== PARALLEL MyVPS v2.3 INSTALL ==='
            old_main=$(sha256sum /root/my_vps_manager.sh | awk '{print $1}')
            old_exit=$(sha256sum /root/my_vps_exit_manager.sh | awk '{print $1}')
            old_cf=$(sha256sum /root/my_vps_cf_ws_manager.sh | awk '{print $1}')
            old_link=$(readlink -f /usr/local/bin/myvps)
            work=$(mktemp -d /var/tmp/myvps-next.XXXXXXXX)
            trap 'rm -rf -- "$work"' EXIT
            source_url="https://raw.githubusercontent.com/Becauseiloveyo/racknerd-v2ray-agent-manager/3db0f52d8151b54f691a60fb8a78c7de1711585c"
            curl -fLsS --retry 3 --connect-timeout 10 --max-time 45 -o "$work/my_vps_manager.sh" "$source_url/my_vps_manager.sh"
            curl -fLsS --retry 3 --connect-timeout 10 --max-time 45 -o "$work/myvps_runtime.py" "$source_url/myvps_runtime.py"
            bash -n "$work/my_vps_manager.sh"
            PYTHONDONTWRITEBYTECODE=1 python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read())' "$work/myvps_runtime.py"
            grep -Fq 'VERSION="2.3.0-rc1"' "$work/my_vps_manager.sh"
            grep -Fq 'SELF="/opt/myvps/bin/my_vps_manager.sh"' "$work/my_vps_manager.sh"
            grep -Fq 'RC update disabled' "$work/my_vps_manager.sh"
            install -d -m 755 /opt/myvps/bin
            if [ -f /opt/myvps/bin/my_vps_manager.sh ]; then cp -a /opt/myvps/bin/my_vps_manager.sh /opt/myvps/bin/my_vps_manager.sh.previous; fi
            if [ -f /opt/myvps/bin/myvps_runtime.py ]; then cp -a /opt/myvps/bin/myvps_runtime.py /opt/myvps/bin/myvps_runtime.py.previous; fi
            install -m 700 "$work/my_vps_manager.sh" /opt/myvps/bin/my_vps_manager.sh.next
            install -m 700 "$work/myvps_runtime.py" /opt/myvps/bin/myvps_runtime.py.next
            mv -f /opt/myvps/bin/my_vps_manager.sh.next /opt/myvps/bin/my_vps_manager.sh
            mv -f /opt/myvps/bin/myvps_runtime.py.next /opt/myvps/bin/myvps_runtime.py
            ln -sfn /opt/myvps/bin/my_vps_manager.sh /usr/local/bin/myvps-next
            echo '=== PRODUCTION ORIGINALS INTEGRITY ==='
            test "$old_main" = "$(sha256sum /root/my_vps_manager.sh | awk '{print $1}')"
            test "$old_exit" = "$(sha256sum /root/my_vps_exit_manager.sh | awk '{print $1}')"
            test "$old_cf" = "$(sha256sum /root/my_vps_cf_ws_manager.sh | awk '{print $1}')"
            test "$old_link" = "$(readlink -f /usr/local/bin/myvps)"
            echo 'legacy_manager_exit_cf_and_myvps_alias=PRESERVED'
            echo '=== LIVE STATUS ==='
            bash /usr/local/bin/myvps-next status
            echo '=== BACKUP CLOUD STATUS ==='
            bash /usr/local/bin/myvps-next backup-status
            echo '=== SOCKS5 AUTHORIZED CONNECTIVITY ==='
            bash /usr/local/bin/myvps-next chain-test
            echo '=== PRODUCTION SERVICES ==='
            for name in nginx xray-racknerd-443 fail2ban; do
              systemctl is-active --quiet "$name"
              echo "$name=active"
            done
            echo '=== MYVPS NEXT v2.3 VERIFIED; NO SERVICE RESTART ==='
