name: Temporary install validated VPS encrypted backups
on:
  push:
    branches:
      - ops/read-only-vps-audit-20261008
    paths:
      - .github/workflows/deploy-backup-only.yml
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install backup-only helper, upload and validate two backups
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 50s
          command_timeout: 13m
          script_stop: true
          script: |
            set -Eeuo pipefail
            umask 077
            echo '=== BEGIN INDEPENDENT BACKUP SETUP ==='
            printf 'utc='; date -u '+%FT%TZ'
            echo 'Pre-deploy service states (must remain unchanged)'
            for s in nginx xray-racknerd-443 fail2ban; do echo "$s=$(systemctl is-active "$s" 2>/dev/null || true)"; done
            mkdir -p /opt/myvps/backup
            file=$(mktemp /var/tmp/myvps-new-backup.XXXXXXXX)
            trap 'rm -f "$file"' EXIT
            curl -fLsS --retry 3 --connect-timeout 10 --max-time 50 -o "$file" "https://raw.githubusercontent.com/Becauseiloveyo/racknerd-v2ray-agent-manager/0f38b0e669d7ae082670d4ad7d2c3d6b0231ab10/myvps_backup.sh"
            bash -n "$file"
            grep -q '^# Dedicated encrypted backup companion' "$file"
            if [ -f /opt/myvps/backup/myvps_backup.sh ]; then
             cp -a /opt/myvps/backup/myvps_backup.sh /opt/myvps/backup/myvps_backup.sh.previous
            fi
            install -m 700 "$file" /opt/myvps/backup/myvps_backup.sh
            echo 'Installed backup-only helper; existing management, Xray and nginx files untouched'
            bash /opt/myvps/backup/myvps_backup.sh init
            bash /opt/myvps/backup/myvps_backup.sh probe
            echo '=== ENCRYPTED SYSTEM CONFIG BACKUP ==='
            bash /opt/myvps/backup/myvps_backup.sh run config
            echo '=== SQLITE-CONSISTENT BLOG BACKUP ==='
            bash /opt/myvps/backup/myvps_backup.sh run blog
            echo '=== CLOUD DOWNLOAD/DECRYPT RESTORE TESTS ==='
            bash /opt/myvps/backup/myvps_backup.sh restore-test config
            bash /opt/myvps/backup/myvps_backup.sh restore-test blog
            echo '=== ENABLE DAILY TIMERS ==='
            bash /opt/myvps/backup/myvps_backup.sh timers
            systemctl is-active --quiet myvps-backup-config.timer
            systemctl is-active --quiet myvps-backup-blog.timer
            echo '=== POST-DEPLOY SERVICE STATES ==='
            for s in nginx xray-racknerd-443 fail2ban; do echo "$s=$(systemctl is-active "$s" 2>/dev/null || true)"; done
            echo '=== BACKUP SETUP AND VALIDATION COMPLETE ==='
